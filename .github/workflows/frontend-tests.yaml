name: Frontend tests
on:
  workflow_call:
  pull_request:
  push:
    branches: [main, feat/prd-completion]
permissions:
  contents: read
concurrency:
  group: minutes-frontend-tests-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
