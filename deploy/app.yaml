apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  namespace: ${KUBE_NAMESPACE}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ${KUBE_NAMESPACE}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      serviceAccountName: minutes-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: ${BACKEND_IMAGE}
          ports: [{containerPort: 8000}]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: "${KUBE_NAMESPACE}-secrets", key: database-url}
            - name: UPLOAD_DIR
              value: /data/uploads
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef: {name: "${KUBE_NAMESPACE}-secrets", key: auth-secret}
            - name: APP_URL
              value: https://${APP_DOMAIN}
            - name: COOKIE_SECURE
              value: 'true'
            - name: MAIL_MODE
              value: ses
            - name: SES_FROM_EMAIL
              value: ${SES_FROM_EMAIL}
            - name: AWS_REGION
              value: ${AWS_REGION}
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef: {name: "${KUBE_NAMESPACE}-observability", key: sentry-dsn, optional: true}
            - name: SENTRY_ENVIRONMENT
              value: ${DEPLOY_ENVIRONMENT}
            - name: SENTRY_RELEASE
              value: "${SENTRY_RELEASE}"
            - name: METRICS_ENABLED
              value: "${METRICS_ENABLED}"
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef: {name: "${KUBE_NAMESPACE}-observability", key: metrics-token, optional: true}
            - name: TRUSTED_PROXY_IPS
              value: "${TRUSTED_PROXY_IPS}"
          envFrom:
            - secretRef:
                name: ${KUBE_NAMESPACE}-oauth
                optional: true
          volumeMounts: [{name: uploads, mountPath: /data/uploads}]
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket: {port: 8000}
            initialDelaySeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: uploads}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: "${KUBE_NAMESPACE}"}
spec:
  selector: {app: backend}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: purge-deleted-notes
  namespace: ${KUBE_NAMESPACE}
spec:
  schedule: '${PURGE_SCHEDULE}'
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels: {app: purge-deleted-notes}
        spec:
          restartPolicy: Never
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels: {app: backend}
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
          containers:
            - name: purge-deleted-notes
              image: ${BACKEND_IMAGE}
              command: ["python", "-m", "app.jobs", "purge-deleted"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: "${KUBE_NAMESPACE}-secrets", key: database-url}
                - name: UPLOAD_DIR
                  value: /data/uploads
              volumeMounts: [{name: uploads, mountPath: /data/uploads}]
              resources:
                requests: {cpu: 50m, memory: 96Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
          volumes:
            - name: uploads
              persistentVolumeClaim: {claimName: uploads}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-rate-limits
  namespace: ${KUBE_NAMESPACE}
spec:
  schedule: '${RATE_LIMIT_CLEANUP_SCHEDULE}'
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels: {app: cleanup-rate-limits}
        spec:
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 10001}
          containers:
            - name: cleanup-rate-limits
              image: ${BACKEND_IMAGE}
              command: ["python", "-m", "app.jobs", "cleanup-rate-limits"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: "${KUBE_NAMESPACE}-secrets", key: database-url}
              resources:
                requests: {cpu: 10m, memory: 48Mi}
                limits: {cpu: 100m, memory: 96Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
---
