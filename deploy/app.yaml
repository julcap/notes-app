---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: "${KUBE_NAMESPACE}"}
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101}
      containers:
        - name: frontend
          image: ${FRONTEND_IMAGE}
          ports: [{containerPort: 8080}]
          env:
            - name: FRONTEND_SENTRY_DSN
              value: "${FRONTEND_SENTRY_DSN}"
            - name: SENTRY_ENVIRONMENT
              value: ${DEPLOY_ENVIRONMENT}
            - name: SENTRY_RELEASE
              value: "${SENTRY_RELEASE}"
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: "${KUBE_NAMESPACE}"}
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 8080}]
