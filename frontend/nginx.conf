server {
 listen 8080;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 21m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 location = /runtime-config.js { alias /tmp/runtime-config.js; default_type application/javascript; add_header Cache-Control "no-store" always; }
 location /api/auth/ { access_log off; proxy_pass http://backend:8000; proxy_set_header Host $host; add_header Cache-Control "no-store" always; }
 location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_read_timeout 60s; }
 location / { try_files $uri $uri/ /index.html; }
 location = /healthz { access_log off; return 200 'ok'; }
}
